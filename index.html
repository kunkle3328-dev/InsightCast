<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AetherWave Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      @keyframes move-background {
        0% { background-position: 0% 0%; }
        50% { background-position: 100% 100%; }
        100% { background-position: 0% 0%; }
      }

      /* THEME DEFINITIONS */
      :root, [data-theme="cyberpunk"] {
        --bg-main: #050510;
        --bg-surface-1: rgba(0, 0, 0, 0.2);
        --bg-surface-2: rgba(0, 0, 0, 0.3);
        --bg-surface-glass: rgba(0, 0, 0, 0.3);
        --bg-accent-primary: #0891b2; /* cyan-600 */
        --bg-accent-primary-hover: #06b6d4; /* cyan-500 */
        --bg-accent-secondary: #6d28d9; /* violet-700 */
        --bg-disabled: #4b5563; /* gray-600 */
        --bg-danger: #991b1b; /* red-800 */
        --bg-danger-hover: #b91c1c; /* red-700 */

        --text-primary: #e5e7eb; /* gray-200 */
        --text-secondary: #9ca3af; /* gray-400 */
        --text-accent-primary: #22d3ee; /* cyan-400 */
        --text-accent-primary-dark: #164e63; /* cyan-800 */
        --text-accent-secondary: #a78bfa; /* violet-400 */
        --text-inverted: #000000;
        --text-host-alex: #a78bfa; /* violet-400 */
        --text-host-ben: #2dd4bf; /* teal-400 */
        --text-danger: #f87171; /* red-400 */
        --text-warning: #facc15; /* yellow-400 */

        --border-primary: rgba(34, 211, 238, 0.2);
        --border-secondary: rgba(34, 211, 238, 0.3);
        --border-accent: #22d3ee; /* cyan-400 */
        --border-danger: rgba(239, 68, 68, 0.5);

        --shadow-color-primary: rgba(0, 255, 255, 0.7);
        --shadow-color-secondary: rgba(139, 92, 246, 0.7);
        --shadow-color-accent: #0891b2;
        --shadow-glow: rgba(0, 255, 255, 0.4);
        
        --scrollbar-track: rgba(255, 255, 255, 0.05);
        --scrollbar-thumb: rgba(34, 211, 238, 0.3);
        --scrollbar-thumb-hover: rgba(34, 211, 238, 0.5);

        --special-bg-grad-1: rgba(0, 255, 255, 0.1);
        --special-bg-grad-2: rgba(138, 43, 226, 0.08);
        --accent-stop-1: #a78bfa; /* violet-400 */
        --accent-stop-2: #22d3ee; /* cyan-400 */
      }
      
      [data-theme="lightwave"] {
        --bg-main: #f9fafb; /* gray-50 */
        --bg-surface-1: rgba(255, 255, 255, 0.5);
        --bg-surface-2: #ffffff;
        --bg-surface-glass: rgba(255, 255, 255, 0.6);
        --bg-accent-primary: #0ea5e9; /* sky-500 */
        --bg-accent-primary-hover: #0284c7; /* sky-600 */
        --bg-accent-secondary: #4f46e5; /* indigo-600 */
        --bg-disabled: #d1d5db; /* gray-300 */
        --bg-danger: #dc2626; /* red-600 */
        --bg-danger-hover: #b91c1c; /* red-700 */

        --text-primary: #1f2937; /* gray-800 */
        --text-secondary: #4b5563; /* gray-600 */
        --text-accent-primary: #0ea5e9; /* sky-500 */
        --text-accent-primary-dark: #e0f2fe; /* sky-100 */
        --text-accent-secondary: #4f46e5; /* indigo-600 */
        --text-inverted: #ffffff;
        --text-host-alex: #4f46e5; /* indigo-600 */
        --text-host-ben: #0d9488; /* teal-600 */
        --text-danger: #ef4444; /* red-500 */
        --text-warning: #eab308; /* yellow-500 */

        --border-primary: rgba(0, 0, 0, 0.1);
        --border-secondary: rgba(0, 0, 0, 0.15);
        --border-accent: #0ea5e9; /* sky-500 */
        --border-danger: rgba(220, 38, 38, 0.5);

        --shadow-color-primary: rgba(14, 165, 233, 0.7);
        --shadow-color-secondary: rgba(79, 70, 229, 0.7);
        --shadow-color-accent: #38bdf8; /* sky-400 */
        --shadow-glow: rgba(14, 165, 233, 0.4);

        --scrollbar-track: rgba(0, 0, 0, 0.05);
        --scrollbar-thumb: rgba(14, 165, 233, 0.4);
        --scrollbar-thumb-hover: rgba(14, 165, 233, 0.6);

        --special-bg-grad-1: rgba(14, 165, 233, 0.15);
        --special-bg-grad-2: rgba(79, 70, 229, 0.1);
        --accent-stop-1: #4f46e5; /* indigo-600 */
        --accent-stop-2: #0ea5e9; /* sky-500 */
      }
      
      [data-theme="nebula"] {
        --bg-main: #10051e;
        --bg-surface-1: rgba(26, 12, 42, 0.3);
        --bg-surface-2: rgba(26, 12, 42, 0.5);
        --bg-surface-glass: rgba(26, 12, 42, 0.4);
        --bg-accent-primary: #d946ef; /* fuchsia-500 */
        --bg-accent-primary-hover: #c026d3; /* fuchsia-600 */
        --bg-accent-secondary: #8b5cf6; /* violet-500 */
        --bg-disabled: #4b5563; /* gray-600 */
        --bg-danger: #991b1b; /* red-800 */
        --bg-danger-hover: #b91c1c; /* red-700 */

        --text-primary: #f3e8ff; /* purple-50 */
        --text-secondary: #a8a29e; /* stone-400 */
        --text-accent-primary: #f0abfc; /* fuchsia-300 */
        --text-accent-primary-dark: #581c87; /* purple-900 */
        --text-accent-secondary: #c4b5fd; /* violet-300 */
        --text-inverted: #000000;
        --text-host-alex: #c4b5fd; /* violet-300 */
        --text-host-ben: #f472b6; /* pink-400 */
        --text-danger: #f87171; /* red-400 */
        --text-warning: #facc15; /* yellow-400 */

        --border-primary: rgba(217, 70, 239, 0.2);
        --border-secondary: rgba(217, 70, 239, 0.3);
        --border-accent: #d946ef; /* fuchsia-500 */
        --border-danger: rgba(239, 68, 68, 0.5);

        --shadow-color-primary: rgba(217, 70, 239, 0.7);
        --shadow-color-secondary: rgba(139, 92, 246, 0.7);
        --shadow-color-accent: #d946ef;
        --shadow-glow: rgba(217, 70, 239, 0.4);

        --scrollbar-track: rgba(255, 255, 255, 0.05);
        --scrollbar-thumb: rgba(217, 70, 239, 0.3);
        --scrollbar-thumb-hover: rgba(217, 70, 239, 0.5);

        --special-bg-grad-1: rgba(217, 70, 239, 0.12);
        --special-bg-grad-2: rgba(139, 92, 246, 0.1);
        --accent-stop-1: #8b5cf6; /* violet-500 */
        --accent-stop-2: #d946ef; /* fuchsia-500 */
      }

      [data-theme="solaris"] {
        --bg-main: #1a110a;
        --bg-surface-1: rgba(45, 20, 0, 0.2);
        --bg-surface-2: rgba(45, 20, 0, 0.3);
        --bg-surface-glass: rgba(45, 20, 0, 0.4);
        --bg-accent-primary: #ea580c; /* orange-600 */
        --bg-accent-primary-hover: #f97316; /* orange-500 */
        --bg-accent-secondary: #b91c1c; /* red-700 */
        --bg-disabled: #4b5563; /* gray-600 */
        --bg-danger: #991b1b; /* red-800 */
        --bg-danger-hover: #b91c1c; /* red-700 */

        --text-primary: #ffedd5; /* orange-100 */
        --text-secondary: #fdba74; /* orange-300 */
        --text-accent-primary: #facc15; /* amber-400 */
        --text-accent-primary-dark: #b45309; /* amber-700 */
        --text-accent-secondary: #f87171; /* red-400 */
        --text-inverted: #000000;
        --text-host-alex: #facc15; /* amber-400 */
        --text-host-ben: #f87171; /* red-400 */
        --text-danger: #fca5a5; /* red-300 */
        --text-warning: #fde047; /* yellow-300 */

        --border-primary: rgba(251, 146, 60, 0.2);
        --border-secondary: rgba(251, 146, 60, 0.3);
        --border-accent: #facc15; /* amber-400 */
        --border-danger: rgba(239, 68, 68, 0.5);

        --shadow-color-primary: rgba(251, 146, 60, 0.7);
        --shadow-color-secondary: rgba(248, 113, 113, 0.7);
        --shadow-color-accent: #ea580c;
        --shadow-glow: rgba(249, 115, 22, 0.4);

        --scrollbar-track: rgba(255, 255, 255, 0.05);
        --scrollbar-thumb: rgba(251, 146, 60, 0.3);
        --scrollbar-thumb-hover: rgba(251, 146, 60, 0.5);

        --special-bg-grad-1: rgba(234, 88, 12, 0.15);
        --special-bg-grad-2: rgba(185, 28, 28, 0.1);
        --accent-stop-1: #ef4444; /* red-500 */
        --accent-stop-2: #facc15; /* amber-400 */
      }

      [data-theme="oceanic"] {
        --bg-main: #081426;
        --bg-surface-1: rgba(10, 25, 47, 0.3);
        --bg-surface-2: rgba(10, 25, 47, 0.5);
        --bg-surface-glass: rgba(10, 25, 47, 0.4);
        --bg-accent-primary: #14b8a6; /* teal-500 */
        --bg-accent-primary-hover: #2dd4bf; /* teal-400 */
        --bg-accent-secondary: #0284c7; /* sky-600 */
        --bg-disabled: #4b5563; /* gray-600 */
        --bg-danger: #991b1b; /* red-800 */
        --bg-danger-hover: #b91c1c; /* red-700 */

        --text-primary: #cffafe; /* cyan-100 */
        --text-secondary: #7dd3fc; /* sky-300 */
        --text-accent-primary: #67e8f9; /* cyan-300 */
        --text-accent-primary-dark: #155e75; /* cyan-800 */
        --text-accent-secondary: #38bdf8; /* sky-400 */
        --text-inverted: #000000;
        --text-host-alex: #67e8f9; /* cyan-300 */
        --text-host-ben: #6ee7b7; /* emerald-300 */
        --text-danger: #f87171; /* red-400 */
        --text-warning: #facc15; /* yellow-400 */

        --border-primary: rgba(34, 211, 238, 0.2);
        --border-secondary: rgba(34, 211, 238, 0.3);
        --border-accent: #67e8f9; /* cyan-300 */
        --border-danger: rgba(239, 68, 68, 0.5);

        --shadow-color-primary: rgba(34, 211, 238, 0.7);
        --shadow-color-secondary: rgba(56, 189, 248, 0.7);
        --shadow-color-accent: #14b8a6;
        --shadow-glow: rgba(20, 184, 166, 0.4);

        --scrollbar-track: rgba(255, 255, 255, 0.05);
        --scrollbar-thumb: rgba(20, 184, 166, 0.3);
        --scrollbar-thumb-hover: rgba(20, 184, 166, 0.5);

        --special-bg-grad-1: rgba(20, 184, 166, 0.15);
        --special-bg-grad-2: rgba(2, 132, 199, 0.1);
        --accent-stop-1: #38bdf8; /* sky-400 */
        --accent-stop-2: #5eead4; /* teal-300 */
      }

      [data-theme="matrix"] {
        --bg-main: #020a02;
        --bg-surface-1: rgba(5, 25, 5, 0.3);
        --bg-surface-2: rgba(5, 25, 5, 0.5);
        --bg-surface-glass: rgba(5, 25, 5, 0.4);
        --bg-accent-primary: #16a34a; /* green-600 */
        --bg-accent-primary-hover: #22c55e; /* green-500 */
        --bg-accent-secondary: #166534; /* green-800 */
        --bg-disabled: #374151; /* gray-700 */
        --bg-danger: #991b1b; /* red-800 */
        --bg-danger-hover: #b91c1c; /* red-700 */

        --text-primary: #4ade80; /* green-400 */
        --text-secondary: #16a34a; /* green-600 */
        --text-accent-primary: #bef264; /* lime-300 */
        --text-accent-primary-dark: #14532d; /* green-900 */
        --text-accent-secondary: #84cc16; /* lime-500 */
        --text-inverted: #000000;
        --text-host-alex: #bef264; /* lime-300 */
        --text-host-ben: #4ade80; /* green-400 */
        --text-danger: #f87171; /* red-400 */
        --text-warning: #facc15; /* yellow-400 */

        --border-primary: rgba(34, 197, 94, 0.2);
        --border-secondary: rgba(34, 197, 94, 0.3);
        --border-accent: #bef264; /* lime-300 */
        --border-danger: rgba(239, 68, 68, 0.5);

        --shadow-color-primary: rgba(77, 222, 128, 0.7);
        --shadow-color-secondary: rgba(132, 204, 22, 0.7);
        --shadow-color-accent: #16a34a;
        --shadow-glow: rgba(34, 197, 94, 0.5);

        --scrollbar-track: rgba(255, 255, 255, 0.05);
        --scrollbar-thumb: rgba(34, 197, 94, 0.3);
        --scrollbar-thumb-hover: rgba(34, 197, 94, 0.5);

        --special-bg-grad-1: rgba(22, 163, 74, 0.1);
        --special-bg-grad-2: rgba(22, 101, 52, 0.15);
        --accent-stop-1: #22c55e; /* green-500 */
        --accent-stop-2: #bef264; /* lime-300 */
      }

      .futuristic-bg {
        background-color: var(--bg-main);
        background-image:
          radial-gradient(circle at 15% 20%, var(--special-bg-grad-1) 0%, transparent 25%),
          radial-gradient(circle at 85% 80%, var(--special-bg-grad-2) 0%, transparent 30%);
        background-size: 200% 200%;
        animation: move-background 30s ease-in-out infinite;
      }
      .text-shadow-primary {
        text-shadow: 0 0 8px var(--shadow-color-primary);
      }
       .text-shadow-secondary {
        text-shadow: 0 0 5px var(--shadow-color-secondary);
      }
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--scrollbar-track);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--scrollbar-thumb);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--scrollbar-thumb-hover);
      }
      @keyframes animated-gradient {
        0% { background-position: -100% 0; }
        100% { background-position: 100% 0; }
      }
      .animate-progress {
        animation: animated-gradient 1.8s linear infinite;
        background-image: linear-gradient(to right, var(--accent-stop-1), var(--accent-stop-2), var(--accent-stop-1));
        background-size: 200% 100%;
      }
      @keyframes pulse-glow {
        0%, 100% { box-shadow: 0 0 20px var(--shadow-glow); }
        50% { box-shadow: 0 0 35px var(--shadow-glow); }
      }
      @keyframes shimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
      @keyframes live-demo-wave { 
        0%, 100% { transform: scaleY(0.5); } 
        50% { transform: scaleY(1); } 
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",

  }
}
</script>
</head>
  <body class="bg-gray-900 text-gray-100">
    <svg width="0" height="0" style="position:absolute">
      <defs>
        <linearGradient id="aetherwave-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="var(--accent-stop-1)" />
          <stop offset="100%" stop-color="var(--accent-stop-2)" />
        </linearGradient>
      </defs>
    </svg>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
