    <title>AI Podcast Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      .futuristic-bg {
        background-color: #050510;
        background-image:
          radial-gradient(circle at 15% 20%, rgba(0, 255, 255, 0.1) 0%, transparent 25%),
          radial-gradient(circle at 85% 80%, rgba(138, 43, 226, 0.08) 0%, transparent 30%);
        background-size: 100% 100%;
      }
      .text-shadow-cyan {
        text-shadow: 0 0 5px rgba(0, 255, 255, 0.7);
      }
       .text-shadow-indigo {
        text-shadow: 0 0 5px rgba(139, 92, 246, 0.7);
      }
       .text-shadow-teal {
        text-shadow: 0 0 5px rgba(45, 212, 191, 0.7);
      }
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.05);
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(0, 255, 255, 0.3);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(0, 255, 255, 0.5);
      }
      @keyframes animated-gradient {
        0% { background-position: -100% 0; }
        100% { background-position: 100% 0; }
      }
      .animate-progress {
        animation: animated-gradient 1.8s linear infinite;
        background-image: linear-gradient(to right, theme(colors.cyan.500), theme(colors.indigo.500), theme(colors.cyan.500));
        background-size: 200% 100%;
      }
    </style>
